name: CodeWeave checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/app.js
          node --check src/catalog.js
          node --check src/figures.js
          node --check src/logic.js
          node --check src/workbench.js
          node --check src/iterations.js
          node --check src/attempt-backup.js
          node --check src/practice.js
          node --check src/backup.js
          node --check src/mastery.js
          node --check src/exercises.js
          node --check src/multi-file.js
          node --check dev-server.mjs
          node --check server/static-files.mjs
          node --check server/grading-exercises.mjs
          node --check sw.js
      - name: Verify local grading test compiler
        run: gcc --version
      - name: Unit tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling only
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real GCC and browser integration tests
        run: npm run test:browser
        env:
          CODEWEAVE_QA_DIR: ${{ runner.temp }}/codeweave-qa
      - name: Save UI verification image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeweave-browser-qa
          path: ${{ runner.temp }}/codeweave-qa
          if-no-files-found: ignore
          retention-days: 7
