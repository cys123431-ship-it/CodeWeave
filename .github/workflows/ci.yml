name: CodeWeave checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/app.js
          node --check src/catalog.js
          node --check src/figures.js
          node --check src/logic.js
          node --check dev-server.mjs
      - name: Unit tests
        run: npm test
