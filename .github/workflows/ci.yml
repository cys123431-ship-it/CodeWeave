name: CodeWeave checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/app.js
          node --check src/catalog.js
          node --check src/figures.js
          node --check src/logic.js
          node --check src/workbench.js
          node --check src/iterations.js
          node --check src/attempt-backup.js
          node --check src/practice.js
          node --check src/backup.js
          node --check src/mastery.js
          node --check src/exercises.js
          node --check src/multi-file.js
          node --check src/compiler-feedback.js
          node --check dev-server.mjs
          node --check server/static-files.mjs
          node --check server/grading-exercises.mjs
          node --check server/grading-pipeline.mjs
          node --check server/run-submission.mjs
          node --check server/rust-contract.mjs
          node --check server/rust-preparation.mjs
          node --check server/rust-results.mjs
          node --check tests/helpers/observe-process.mjs
          node --check tests/helpers/process-details.mjs
          node --check tests/process-details.test.mjs
          node --check tests/rust-observer.test.mjs
          node --check tests/helpers/rust-budget.mjs
          node --check tests/helpers/rust-build-budget.mjs
          node --check tests/rust-build-budget.test.mjs
          node --check tests/rust-toolchain.test.mjs
          node --check server/rust-tools.mjs
          node --check tests/helpers/rust-tools.mjs
          node --check tests/rust-tools.test.mjs
          node --check server/rust-pipeline.mjs
          node --check tests/helpers/rust-pipeline.mjs
          node --check tests/rust-pipeline.test.mjs
          node --check tests/rust-cancellation.test.mjs
          node --check tests/rust-cleanup.test.mjs
          node --check tests/rust-build-failures.test.mjs
          node --check tests/rust-cargo-cpu.test.mjs
          node --check tests/helpers/linux-process-alive.mjs
          node --check tests/rust-process-state.test.mjs
          node --check tests/rust-resources.test.mjs
          node --check tests/helpers/rust-fixture-linker.mjs
          node --check tests/rust-fixture-linker.test.mjs
          node --check scripts/prepare-rust-inputs.mjs
          node --check tests/rust-toolchain-inputs.test.mjs
          node --check scripts/roadmap.mjs
          node --check tests/theory-handoff.test.mjs
          node --check server/stream-exercise.mjs
          node --check tests/stream-exercise.test.mjs
          node --check server/sort-exercise.mjs
          node --check tests/sort-exercise.test.mjs
          node --check sw.js
      - name: Verify local grading test compiler
        run: gcc --version
      - name: Select and verify the fixed trusted Rust toolchain
        run: |
          toolchain=$(node --input-type=module -e "import {RUST_TOOLCHAIN_VERSION} from './server/rust-preparation.mjs'; console.log(RUST_TOOLCHAIN_VERSION)")
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          node --input-type=module -e "import {spawnSync} from 'node:child_process'; import {checkRustToolchain} from './server/rust-preparation.mjs'; console.log(checkRustToolchain(spawnSync('cargo',['--version'],{encoding:'utf8',timeout:5000}),spawnSync('rustc',['--version'],{encoding:'utf8',timeout:5000})))"
      - name: Verify trusted Rust fixture tools
        run: |
          cargo --version
          rustc --version
          cc --version
          ld --version
          node --input-type=module -e "import {rustFixtureFlags} from './tests/helpers/rust-fixture-linker.mjs'; console.log('Trusted fixture flags:', rustFixtureFlags())"
      - name: Prepare trusted Rust toolchain input pages
        timeout-minutes: 2
        run: node scripts/prepare-rust-inputs.mjs
      - name: Unit tests
        run: npm test
        env:
          CODEWEAVE_REQUIRE_RUST: '1'

  macos-resources:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select and verify the fixed trusted Rust toolchain
        run: |
          toolchain=$(node --input-type=module -e "import {RUST_TOOLCHAIN_VERSION} from './server/rust-preparation.mjs'; console.log(RUST_TOOLCHAIN_VERSION)")
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          node --input-type=module -e "import {spawnSync} from 'node:child_process'; import {checkRustToolchain} from './server/rust-preparation.mjs'; console.log(checkRustToolchain(spawnSync('cargo',['--version'],{encoding:'utf8',timeout:5000}),spawnSync('rustc',['--version'],{encoding:'utf8',timeout:5000})))"
      - name: Verify resource runner syntax and compiler
        run: |
          node --check server/run-submission.mjs
          gcc --version
      - name: POSIX resource and descendant regressions
        run: node --test tests/submission-resources.test.mjs
      - name: POSIX stream contract and read-error probes
        run: node --test tests/stream-exercise.test.mjs
      - name: E02 stable insertion contract and complete example
        run: node --test tests/sort-exercise.test.mjs
      - name: Trusted Rust execution resource probes
        run: |
          rustc --version
          node --test tests/rust-resources.test.mjs
        env:
          CODEWEAVE_REQUIRE_RUST: '1'
      - name: Trusted Cargo build budgets and actual build-result fixtures
        run: node --test --test-concurrency=1 tests/rust-tools.test.mjs tests/rust-build-budget.test.mjs tests/rust-preparation.test.mjs tests/rust-results.test.mjs
        env:
          CODEWEAVE_REQUIRE_RUST: '1'
      - name: Trusted Rust integrated lifecycle and cleanup
        run: node --test --test-concurrency=1 tests/rust-pipeline.test.mjs tests/rust-cancellation.test.mjs tests/rust-cleanup.test.mjs tests/rust-process-state.test.mjs tests/rust-build-failures.test.mjs tests/rust-cargo-cpu.test.mjs
        env:
          CODEWEAVE_REQUIRE_RUST: '1'
      - name: Diagnose macOS limits on failure
        if: failure()
        run: |
          /bin/bash --noprofile --norc -c 'ulimit -a; ps -o vsz= -p $$'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling only
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real GCC and browser integration tests
        run: npm run test:browser
        env:
          CODEWEAVE_QA_DIR: ${{ runner.temp }}/codeweave-qa
      - name: Save UI verification image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeweave-browser-qa
          path: ${{ runner.temp }}/codeweave-qa
          if-no-files-found: ignore
          retention-days: 7
